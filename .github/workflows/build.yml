# Builds, tests and packs the library on every push and pull request, and publishes it on a version tag.
#
# Not finished on purpose until the open decisions in docs/Releasing.md are made. Building and testing already work.
# Packing warns on pull requests and pushes to main, so their checks can pass, and fails on a version tag. Publishing
# fails.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, for versioning from git tags (see docs/Releasing.md).
          fetch-depth: 0

      # The newest SDK of the 10.0.1xx band, the lowest band global.json allows (latestFeature takes any 10.0 band
      # from 10.0.100 up), so CI tests the oldest SDK a contributor may build with. Not global-json-file: it would
      # install exactly the version global.json names (10.0.100), not the newest patch.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      # NuGet packages, keyed on every file that sets a package or a feed. A version change misses the key and
      # restores the newest cache for the OS; Restore fetches only what is missing, and the whole folder, old versions
      # included, is saved under the new key.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # The checks a change must pass, as run locally: scripts/gate.sh lists them. A pull request is checked against
      # its base branch, a push against the script's default. The coverage settings and format are set in the test
      # project (TestingPlatformCommandLineArguments).
      - name: Gate (scripts/gate.sh)
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: >-
          bash scripts/gate.sh ${BASE_REF:+--base "origin/$BASE_REF"}
          -- --coverage --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      # Until the repository URL is set (see Directory.Build.targets) this warns, except on a version tag, where it
      # fails: nothing may be released before then.
      - name: Pack
        run: >-
          dotnet pack src/OrchestrationEngines/OrchestrationEngines.csproj --no-build --configuration Release
          --output artifacts/packages
          -p:RequirePackagingDecisions=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # TODO: when publishing is set up, add a protected environment and, for nuget.org Trusted Publishing,
    # "permissions: id-token: write" (see docs/Releasing.md).
    steps:
      - name: Publishing is not set up yet
        run: |
          echo "::error::Publishing is not set up yet. Decide the open points in docs/Releasing.md first."
          exit 1
